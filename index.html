<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tidings — PR relationships & reporting</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="topbar"><div class="logo">Tidings<span>.</span></div><small>by Swell PR & Communications — PR relationships & reporting</small><div class="spacer"></div><span id="who" class="mut" style="color:#fff"></span><button class="btn ghost" id="logoutBtn">Logout</button></div>
<div id="auth" class="card"><h2>Welcome to Tidings</h2><p class="mut">Single log of every media interaction. Demo: <b>demo@tidings.app / demo123</b></p>
<label>Name (register only)</label><input id="a_name" placeholder="Your name"><label>Email</label><input id="a_email" value="demo@tidings.app"><label>Password</label><input id="a_pass" type="password" value="demo123"><label>Role</label><select id="a_role"><option value="pr">PR professional</option><option value="journalist">Journalist</option></select>
<label>Backend URL (your AWS API host — empty = this site)</label><input id="a_backend" placeholder="https://api.example.com:3000">
<div style="display:flex;gap:8px"><button class="btn" id="loginBtn">Login</button><button class="btn dark" id="regBtn">Register</button></div><p id="a_err" style="color:#b3125f"></p></div>
<div class="layout hidden" id="app"><nav class="nav" id="nav"></nav><div class="main" id="view"></div></div>
<script src="config.js"></script>
<script src="app.js"></script></body></html>
